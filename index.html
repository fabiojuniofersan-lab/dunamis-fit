<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dunamis Fit Gestão</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .avatar{display:block;border-radius:50%;object-fit:cover;border:2px solid #f28c18;background:#111;flex:none}.avatar-fallback{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}.person{display:flex;align-items:center;gap:10px}.person small,.payment-row small,.user-mini small{display:block;color:#777;margin-top:3px}.user-mini{display:flex;align-items:center;gap:10px;padding:14px 12px;margin:8px 0 14px;background:rgba(255,255,255,.05);border-radius:14px;color:#fff}.user-mini b{display:block;font-size:13px}.profile-hero,.development-head,.profile-photo{display:flex;align-items:center;justify-content:space-between;gap:18px;background:#fff;border:1px solid #eee;border-radius:20px;padding:22px;margin-bottom:18px}.profile-hero>div,.development-head>div,.profile-photo{display:flex;align-items:center;gap:16px}.billing-card{display:flex;justify-content:space-between;align-items:center;gap:20px;background:#111;color:#fff;border-radius:22px;padding:24px;margin-bottom:18px;box-shadow:0 14px 35px rgba(0,0,0,.16)}.billing-main{display:flex;flex-direction:column;gap:5px}.billing-main strong{font-size:30px}.billing-main span{color:#bbb}.payment-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid #eee}.payment-row>div:first-child{min-width:0}.payment-row .person{flex:1}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.small-btn{width:auto!important;padding:10px 16px!important}.notice{padding:13px 15px;border-radius:12px;background:#f5f5f5;margin:10px 0}.notice.success{background:#eaf8ef;color:#176b39}.notice.danger{background:#fff0f0;color:#9a2525}.plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.plan-card{background:#fff;border:1px solid #eee;border-radius:22px;padding:24px;box-shadow:0 10px 25px rgba(0,0,0,.06)}.plan-card strong{display:block;font-size:34px;margin:12px 0}.plan-tag{font-size:11px;font-weight:800;letter-spacing:1px;color:#f28c18}.timeline{display:flex;flex-direction:column;gap:0}.timeline-item{padding:16px 0;border-left:3px solid #f28c18;padding-left:16px;display:flex;flex-direction:column;gap:5px}.profile-photo{justify-content:flex-start}.profile-photo input{display:block;margin-top:12px}.empty{text-align:center;padding:30px;color:#777}.login-panel .demo{display:none!important}.login-panel .btn{width:100%}.payment-method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.online-method{border:1px solid #e8e8e8;background:#fff;border-radius:18px;padding:20px;text-align:left;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:7px}.online-method:hover{transform:translateY(-2px);border-color:#f28c18;box-shadow:0 8px 20px rgba(0,0,0,.08)}.online-method strong{font-size:16px}.online-method span{font-size:12px;color:#777}.payment-placeholder{margin-top:16px;padding:18px;border-radius:16px;background:#f7f7f7;border:1px dashed #ddd}.payment-placeholder p{color:#666;line-height:1.5}@media(max-width:800px){.plans-grid,.payment-method-grid{grid-template-columns:1fr}.profile-hero,.billing-card,.payment-row{align-items:flex-start;flex-direction:column}.panel-head{align-items:flex-start;flex-direction:column}.hero{min-height:280px}.profile-photo{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=8"></script>
  <script src="supabase-client.js?v=8"></script>
  <script src="app.js?v=8"></script>
  <script src="auth4.js?v=8"></script>
  <script src="ui-fixes.js?v=5"></script>
  <script src="final-fixes.js?v=5"></script>
  <script src="payment-fix.js?v=7"></script>
  <script src="plans-fix.js?v=5"></script>
  <script src="admin-student-fix.js?v=4"></script>
  <script src="status-fix.js?v=3"></script>
  <script src="payment-student-fix.js?v=2"></script>
  <script src="globals-bridge.js?v=1"></script>
  <script src="students-search-fix.js?v=1"></script>
</body>
</html>
