<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dunamis Fit Gestão</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    #tela-abertura {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.8s ease;
    }

    #tela-abertura img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #tela-abertura.ocultar {
      opacity: 0;
      pointer-events: none;
    }

    #app {
      min-height: 100vh;
    }
  </style>
</head>

<body>

  <div id="tela-abertura">
    <img
      src="dunamis-fit-abertura.png"
      alt="Dunamis Fit - Força que vem do alto"
    >
  </div>

  <div id="app"></div>

  <script src="app.js"></script>

  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        const abertura = document.getElementById("tela-abertura");

        if (abertura) {
          abertura.classList.add("ocultar");

          setTimeout(function () {
            abertura.remove();
          }, 800);
        }
      }, 2500);
    });
  </script>

</body>
</html>
